<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Infographic và Video Nhiệm vụ 2.2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
      margin-bottom: 20px;
    }
    img {
      width: 100%;
      height: auto;
      margin-bottom: 20px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    iframe {
      width: 100%;
      height: 480px;
      border: none;
      border-radius: 8px;
    }
    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Infographic và Video Nhiệm vụ 2.2</h1>
    <p>Trang web này hiển thị infographic minh họa và video YouTube phục vụ cho bài tập Nhiệm vụ 2.2.</p>
    
    <!-- Hiển thị infographic -->
    <img src="Lab05_Ex2.1.png" alt="Infographic Lab05_Ex2.1">

    <!-- Nhúng video YouTube -->
    <iframe src="https://www.youtube.com/embed/tN4X06E9hyM" 
            title="Video Nhiệm vụ 2.2" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>

    <footer>
      <p>&copy; 2026 Bản quyền thuộc về tác giả. Nội dung chỉ sử dụng cho mục đích học tập.</p>
    </footer>
  </div>
</body>
</html>
